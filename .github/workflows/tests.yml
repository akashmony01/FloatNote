name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # reused by the release workflow

jobs:
  test:
    # FloatNote targets Ubuntu 24.04 and needs the system Python for GTK (python3-gi).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-gi gir1.2-gtk-3.0 libportaudio2 shellcheck

      - name: Install FloatNote
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e '.[dev]'

      - name: Run tests
        run: .venv/bin/pytest -q

      - name: Check shell scripts
        run: |
          bash -n install.sh packaging/build-deb.sh
          shellcheck --severity=warning install.sh packaging/build-deb.sh packaging/debian/postinst packaging/debian/postrm
